name: FPO Smoke Tests

on:
  workflow_dispatch:

  schedule:
    - cron: '0 16 * * *'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Maven Tests
        working-directory: FPO
        run: mvn clean test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            FPO/reports/
            FPO/test-output/
