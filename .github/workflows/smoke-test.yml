name: FPO Smoke Tests

on:
  workflow_dispatch:

  schedule:
    - cron: '50 6 * * *'   # 04:00 UTC = 9:00 PM PDT (during daylight saving)

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java Version
        run: java -version

      - name: Clean Old Reports
        run: |
          rm -f FPO/reports/*.html || true
          rm -rf FPO/test-output/* || true

      - name: Run Maven Tests
        working-directory: FPO
        run: mvn clean test

      - name: Find Latest Report
        if: always()
        id: latest_report
        run: |
          REPORT=$(find FPO/reports -name "*.html" -type f | xargs ls -t 2>/dev/null | head -1)

          if [ -n "$REPORT" ]; then
            echo "report=$REPORT" >> $GITHUB_OUTPUT
            echo "Latest report: $REPORT"
          else
            echo "report=" >> $GITHUB_OUTPUT
            echo "No report found."
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            FPO/reports/
            FPO/test-output/
          if-no-files-found: warn

      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: FPO Automation Execution Report - Run #${{ github.run_number }}
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions
          body: |
            FPO Automation Suite execution completed.

            Repository: ${{ github.repository }}
            Run Number: ${{ github.run_number }}
            Workflow: ${{ github.workflow }}

            Please find the latest automation report attached.
          attachments: ${{ steps.latest_report.outputs.report }}
